name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Install, check, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Svelte and TypeScript checks
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Offline intelligence tests
        run: node tests/intelligence.test.mjs && node tests/development-guardrail.test.mjs && node tests/orchestration.test.mjs && node tests/unified-development.test.mjs && node tests/engineering-worker.test.mjs && node tests/development-advisory.test.mjs && node tests/development-advisory-disclosure.test.mjs

      - name: Production build
        run: npm run build
